name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, redis
          coverage: none

      - name: Dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Estilo de código (Pint)
        run: vendor/bin/pint --test

      - name: Análisis estático (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --error-format=github --memory-limit=1G

  phpunit-mysql:
    runs-on: ubuntu-latest

    # Producción usa MySQL; SQLite no ejerce lockForUpdate() ni la semántica
    # de NULL en el índice único de slots, así que la suite corre contra MySQL.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: mssc_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Las variables de entorno reales tienen prioridad sobre las <env> de
    # phpunit.xml (que apuntan a SQLite en memoria para el uso local).
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mssc_test
      DB_USERNAME: root
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, redis
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Dependencias JS y build (las vistas usan @vite)
        run: |
          npm ci
          npm run build

      - name: Tests
        run: php artisan test